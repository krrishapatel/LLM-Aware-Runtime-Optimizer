name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in setup.py and the current release.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only. The default index would pull the CUDA build, which
          # is about 2.5 GB and pointless on a CPU runner.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Show the quantization backend
        # The measured numbers in the README are from qnnpack on arm64. CI runs
        # x86 with fbgemm, so print which engine is in use before the tests.
        run: |
          python -c "import torch, platform; print(platform.machine(), torch.__version__, list(torch.backends.quantized.supported_engines))"

      - name: Test
        run: python -m pytest -v

      - name: Check the package installs and the CLI runs
        run: |
          llm-optimize info
          llm-optimize --help
